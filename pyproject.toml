[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imu-error-model"
version = "0.1.2"
description = "Composable stochastic and parametric error models for synthetic IMU increments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "PyYAML>=6"
]
keywords = ["imu", "inertial", "sensor", "noise", "simulation", "allan-variance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage[toml]>=7",
    "matplotlib>=3.8",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.6",
    "setuptools>=68",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["imu_error_model"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E702"]

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = ["build", "dist", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"imu_error_model.data.example_profiles" = ["catalog.json", "baselines/*.yaml", "hardware_estimates/*.yaml"]
