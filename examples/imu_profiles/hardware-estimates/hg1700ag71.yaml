accelerometer:
  # AG71 inertial channel: +/-70 g, 300 ppm scale accuracy, 500 ppm linearity.
  measurement_range: 686.4655
  scale_factor: 300e-6
  nonlinear_factor: 500e-6
  # AG71 inertial channel: VRW 0.065 ft/s/sqrt(hr) -> SI density.
  white_noise_density: 3.302e-4
  # AG71 inertial channel output noise is 0.008 ft/sec max; its 500 urad
  # alignment stability, 100 urad non-orthogonality, and 500 ug VRE are
  # documented but intentionally not mapped into this noise-only profile.
  # AG71 inertial channel: 1 mg bias, used as a conservative 1-sigma proxy.
  turn_on_bias_std: 0.00980665
  bias_std: 0.00980665
  bias_correlation_time: 250.0
  apply_clipping: false
  misalignment_std: 0.0
  output_scale: 1048576.0
  reference_temperature_celsius: 25.0
  thermal_bias_coefficient: [ 0.0, 0.0, 0.0 ]
  thermal_scale_factor_coefficient: [ 0.0, 0.0, 0.0 ]

gyroscope:
